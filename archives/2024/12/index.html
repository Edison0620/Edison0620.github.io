<script>
  (function () {
    var selected = 'light';
    try {
      var stored = localStorage.getItem('carver-theme');
      if (stored === 'dark' || stored === 'light') {
        selected = stored;
        localStorage.removeItem('eishan-theme');
      } else {
        var legacy = localStorage.getItem('eishan-theme');
        if (legacy === 'dark' || legacy === 'light') {
          selected = legacy;
          localStorage.setItem('carver-theme', legacy);
          localStorage.removeItem('eishan-theme');
        }
      }
    } catch (error) {
      if (stored === 'dark' || stored === 'light') selected = stored;
    }
    document.documentElement.setAttribute('data-theme', selected);
    document.documentElement.style.colorScheme = selected;
    document.querySelector('meta[name="theme-color"]').setAttribute('content', selected === 'dark' ? '#101311' : '#f9f9f7');
    var accent = 'orange';
    try {
      var storedAccent = localStorage.getItem('carver-accent');
      if (/^(yellow|green|blue|purple)$/.test(storedAccent)) accent = storedAccent;
    } catch (error) { /* Storage may be unavailable. */ }
    document.documentElement.setAttribute('data-accent', accent);
  })();
</script>
<script>
  (function () {
    function titleFor(url) {
      if (!url || new URL(url).origin !== location.origin) return null;
      var path = new URL(url).pathname;
      var match = null;
      var rows = document.querySelectorAll('a.project-row--post');
      for (var i = 0; i < rows.length; i++) {
        var title = rows[i].querySelector('.project-title');
        if (title.style.viewTransitionName === 'post-title') title.style.viewTransitionName = '';
        if (new URL(rows[i].href).pathname === path) match = title;
      }
      return match;
    }

    var selectedHref = null;
    document.addEventListener('click', function (event) {
      var link = event.target.closest && event.target.closest('a.project-row--post');
      if (link && event.button === 0 && !event.metaKey && !event.ctrlKey &&
          !event.shiftKey && !event.altKey && !link.hasAttribute('download') &&
          (!link.target || link.target === '_self')) selectedHref = link.href;
    }, true);

    window.addEventListener('pageswap', function (event) {
      if (!event.viewTransition) return;
      try {
        if (document.querySelector('.writing-header .writing-title')) {
          sessionStorage.setItem('carver-transition-source', location.href);
        } else {
          sessionStorage.removeItem('carver-transition-source');
        }
      } catch (error) {}
      var destination = (event.activation && event.activation.entry && event.activation.entry.url) || selectedHref;
      var title = titleFor(destination);
      if (title) title.style.viewTransitionName = 'post-title';
      else if (destination && new URL(destination).pathname.endsWith('.html')) {
        var articleTitle = document.querySelector('.writing-header .writing-title');
        if (articleTitle) articleTitle.style.viewTransitionName = 'none';
      }
    });
    window.addEventListener('pagereveal', function (event) {
      if (!event.viewTransition) return;
      var activation = event.activation || (window.navigation && window.navigation.activation);
      var title = titleFor(activation && activation.from && activation.from.url);
      if (!title) {
        try { title = titleFor(sessionStorage.getItem('carver-transition-source')); } catch (error) {}
      }
      if (title) {
        title.style.viewTransitionName = 'post-title';
        var reset = function () { title.style.viewTransitionName = ''; };
        event.viewTransition.finished.then(reset, reset);
      }
      var articleTitle = document.querySelector('.writing-header .writing-title');
      if (articleTitle && articleTitle.style.viewTransitionName === 'none') {
        var restore = function () { articleTitle.style.viewTransitionName = 'post-title'; };
        event.viewTransition.finished.then(restore, restore);
      }
    });
  })();
</script>
